<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Pragya ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#050208;
    font-family:Georgia,serif;
    color:white;
}

/* BACKGROUND */

.space{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(126,40,180,.25),
    transparent 35%),
    linear-gradient(#08030d,#020104);
}

/* STARS */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    0%,100%{opacity:.1}
    50%{opacity:1}
}

/* HEART PARTICLES */

.heart{
    position:absolute;
    bottom:-30px;
    color:#d86cff;
    animation:rise linear forwards;
    opacity:.8;
}

@keyframes rise{
    from{
        transform:translateY(0) scale(.5) rotate(0);
        opacity:0;
    }
    15%{opacity:1}
    to{
        transform:translateY(-110vh) scale(1.4) rotate(360deg);
        opacity:0;
    }
}

/* MAIN */

.scene{
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* INTRO */

.intro{
    text-align:center;
    transition:1s;
}

.intro h1{
    font-size:clamp(28px,6vw,55px);
    font-weight:normal;
    margin-bottom:15px;
}

.intro p{
    color:#d7a4e9;
    letter-spacing:4px;
    font-size:12px;
}

/* ENVELOPE */

.envelope{
    width:320px;
    height:220px;
    position:relative;
    margin:40px auto 0;
    cursor:pointer;
    perspective:1000px;
}

.envelope-body{
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,#63257e,#27102f);
    border-radius:8px;
    box-shadow:
        0 20px 80px rgba(166,60,220,.3),
        inset 0 0 30px rgba(255,255,255,.05);
}

/* LETTER INSIDE */

.paper{
    position:absolute;
    width:240px;
    height:160px;
    left:40px;
    top:20px;
    background:#fffaf2;
    color:#381d40;
    padding:20px;
    z-index:2;
    transition:1.2s;
    box-shadow:0 5px 20px #000;
}

.paper h3{
    font-size:17px;
}

.paper p{
    margin-top:10px;
    font-size:11px;
    opacity:.7;
}

/* FLAP */

.flap{
    position:absolute;
    left:0;
    top:0;
    width:0;
    height:0;
    border-left:160px solid transparent;
    border-right:160px solid transparent;
    border-top:120px solid #783693;
    transform-origin:top;
    transition:1s;
    z-index:4;
}

/* SEAL */

.seal{
    position:absolute;
    z-index:8;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#bd5be8;
    display:flex;
    justify-content:center;
    align-items:center;
    left:131px;
    top:80px;
    font-size:25px;
    box-shadow:0 0 30px #bd5be8;
    transition:.6s;
}

/* OPEN */

.envelope.open .flap{
    transform:rotateX(180deg);
}

.envelope.open .paper{
    transform:translateY(-150px);
}

.envelope.open .seal{
    transform:scale(0);
    opacity:0;
}

/* OPEN TEXT */

.tap{
    margin-top:25px;
    color:#d99aee;
    letter-spacing:3px;
    font-size:12px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{opacity:.3}
}

/* LETTER */

.letter{
    position:absolute;
    width:min(720px,94vw);
    max-height:88vh;
    overflow:auto;
    background:#fffaf3;
    color:#28152e;
    padding:55px clamp(25px,7vw,70px);
    border-radius:6px;

    opacity:0;
    transform:scale(.7) translateY(50px);
    pointer-events:none;

    transition:1.2s cubic-bezier(.2,.8,.2,1);

    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        0 0 70px rgba(180,70,230,.25);
}

.letter.show{
    opacity:1;
    transform:scale(1) translateY(0);
    pointer-events:auto;
}

.letter h2{
    text-align:center;
    font-size:clamp(30px,6vw,50px);
    color:#632477;
    font-weight:normal;
}

.subtitle{
    text-align:center;
    margin:12px 0 40px;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:4px;
    color:#9d63aa;
    text-transform:uppercase;
}

.text{
    font-size:18px;
    line-height:1.9;
}

.text p{
    margin-bottom:20px;
}

/* TYPEWRITER */

.cursor{
    display:inline-block;
    width:2px;
    height:20px;
    background:#712d86;
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

.signature{
    text-align:right;
    margin-top:30px;
    color:#672679;
    font-size:22px;
}

.final{
    text-align:center;
    margin-top:35px;
    padding-top:30px;
    border-top:1px solid #dfcce3;
}

.big-heart{
    font-size:55px;
    display:block;
    animation:beat 1.3s infinite;
}

@keyframes beat{
    0%,100%{transform:scale(1)}
    25%{transform:scale(1.25)}
    40%{transform:scale(1)}
    60%{transform:scale(1.15)}
}

.final strong{
    color:#6b287d;
    letter-spacing:5px;
    font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

    .envelope{
        width:280px;
        height:195px;
    }

    .flap{
        border-left-width:140px;
        border-right-width:140px;
        border-top-width:105px;
    }

    .paper{
        width:210px;
        left:35px;
    }

    .seal{
        left:111px;
        top:68px;
    }

    .letter{
        max-height:92vh;
        padding:40px 24px;
    }

    .text{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="space" id="space"></div>

<div class="scene">

    <!-- INTRO + ENVELOPE -->

    <div class="intro" id="intro">

        <h1>For Pragya ❤️</h1>

        <p>A little something from my heart</p>

        <div class="envelope" id="envelope">

            <div class="paper">
                <h3>Dear Pragya ❤️</h3>
                <p>There are some things I want to tell you...</p>
            </div>

            <div class="envelope-body"></div>

            <div class="flap"></div>

            <div class="seal">♥</div>

        </div>

        <div class="tap">
            TAP THE LETTER
        </div>

    </div>


    <!-- LETTER -->

    <article class="letter" id="letter">

        <h2>Dear Pragya</h2>

        <div class="subtitle">
            From my heart to yours
        </div>

        <div class="text" id="letterText"></div>

        <div class="signature">
            Forever yours,<br>
            <strong>❤️</strong>
        </div>

        <div class="final">

            <span class="big-heart">❤️</span>

            <strong>
                I LOVE YOU, PRAGYA
            </strong>

        </div>

    </article>

</div>


<script>

/* =========================
   STARS
========================= */

const space = document.getElementById("space");

for(let i=0;i<130;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    const size=Math.random()*2+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.animationDelay=
        Math.random()*3+"s";

    space.appendChild(star);
}


/* =========================
   FLOATING HEARTS
========================= */

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML=
        ["♥","♡","✦","❤"][Math.floor(Math.random()*4)];

    heart.style.left=
        Math.random()*100+"%";

    heart.style.fontSize=
        10+Math.random()*20+"px";

    heart.style.animationDuration=
        5+Math.random()*6+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },12000);
}

setInterval(createHeart,650);


/* =========================
   LETTER CONTENT
========================= */

const paragraphs=[

`My dearest Pragya,`,

`I don't know if words will ever be enough to explain what you mean to me, but I still want to try.`,

`Somehow, you became someone incredibly special to me. Your smile, your presence, your little ways of making ordinary moments feel different — all of it means more to me than I can properly explain.`,

`I want you to know that I appreciate you. Not just for the beautiful moments, but for who you are when nobody is watching.`,

`I don't promise that every day will be perfect. Life isn't perfect, and neither are we.`,

`But if life ever becomes difficult, I want to be someone who stays. Someone who listens. Someone who chooses you even when things aren't easy.`,

`Out of all the people in this enormous world, somehow our paths crossed.`,

`And honestly, Pragya... I'm grateful they did.`,

`If you ever wonder what you mean to me, remember this:`,

`You are not just someone I love. You are someone I am genuinely grateful to have in my life.`,

`Whatever tomorrow brings, one thing will always be true...`,

`I will always be thankful that I met you.`

];


/* =========================
   TYPEWRITER
========================= */

const letterText=
document.getElementById("letterText");

let paragraphIndex=0;

function typeParagraph(){

    if(paragraphIndex>=paragraphs.length)
        return;

    const p=document.createElement("p");

    letterText.appendChild(p);

    const text=paragraphs[paragraphIndex];

    let char=0;

    const interval=setInterval(()=>{

        p.textContent+=text[char];

        char++;

        if(char>=text.length){

            clearInterval(interval);

            paragraphIndex++;

            setTimeout(typeParagraph,500);
        }

    },25);
}


/* =========================
   OPEN LETTER
========================= */

const envelope=
document.getElementById("envelope");

const intro=
document.getElementById("intro");

const letter=
document.getElementById("letter");

envelope.addEventListener("click",()=>{

    envelope.classList.add("open");

    setTimeout(()=>{

        intro.style.opacity="0";
        intro.style.transform="scale(.7)";

    },700);

    setTimeout(()=>{

        intro.style.display="none";

        letter.classList.add("show");

        typeParagraph();

    },1300);

});


/* =========================
   CLICK HEART BURST
========================= */

document.addEventListener("click",(event)=>{

    for(let i=0;i<7;i++){

        const heart=
        document.createElement("div");

        heart.innerHTML="♥";

        heart.style.position="fixed";

        heart.style.left=
            event.clientX+"px";

        heart.style.top=
            event.clientY+"px";

        heart.style.color="#d866ff";

        heart.style.zIndex="999";

        heart.style.pointerEvents="none";

        const x=
            (Math.random()-.5)*180;

        const y=
            (Math.random()-.5)*180;

        heart.animate([

            {
                transform:"translate(0,0) scale(1)",
                opacity:1
            },

            {
                transform:
                `translate(${x}px,${y}px) scale(0)`,
                opacity:0
            }

        ],{

            duration:1000,
            easing:"ease-out"

        });

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },1000);

    }

});

</script>

</body>
</html>
